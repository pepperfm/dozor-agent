name: Go agent migration

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'runtime/go/**'
      - '.github/workflows/go-agent.yml'
      - 'src/Payload.php'
      - 'src/PayloadType.php'
  pull_request:
    paths:
      - 'runtime/go/**'
      - '.github/workflows/go-agent.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Test Go packages with race detector
        working-directory: runtime/go
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
      - name: Build local contract binary
        working-directory: runtime/go
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/dozor-agent ./cmd/dozor-agent
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Exercise existing PHP Payload against Go receiver
        shell: bash
        run: |
          set -euo pipefail
          export DOZOR_TEST_TOKEN="dozor-go-contract-fixture"
          export DOZOR_TOKEN="$DOZOR_TEST_TOKEN"
          export DOZOR_GO_SPOOL_PATH="$RUNNER_TEMP/dozor-go-spool"
          export DOZOR_INGEST_URI="127.0.0.1:4816"
          /tmp/dozor-agent --ingest-only > "$RUNNER_TEMP/dozor-agent.log" 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          sleep 1
          php runtime/go/tests/php_client.php
          test "$(find "$DOZOR_GO_SPOOL_PATH/queue" -name '*.json' | wc -l)" -ge 1

  php-golden-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Install PHP transformer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate candidate fixtures
        run: DOZOR_GENERATE_GOLDENS=1 php runtime/go/tests/generate_goldens.php
      - name: Verify checked-in PHP reference fixtures
        run: php -d zend.assertions=1 -d assert.exception=1 runtime/go/tests/generate_goldens.php

  cross-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Cross-compile experimental CLI (not a production release)
        working-directory: runtime/go
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go mod tidy
          go build -trimpath -ldflags="-s -w" -o "dist/dozor-agent-${GOOS}-${GOARCH}" ./cmd/dozor-agent
      - uses: actions/upload-artifact@v4
        with:
          name: dozor-agent-experimental-${{ matrix.os }}-${{ matrix.arch }}
          path: runtime/go/dist/dozor-agent-*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, php-golden-fixtures, cross-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dozor-agent-experimental-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum dozor-agent-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish Go binaries with verified checksums
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
