name: Publish Dozor Go Agent to Beget S3

on:
  push:
    branches: [master]
    paths:
      - 'runtime/go/**'
      - '.github/workflows/go-agent-s3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dozor-go-agent-s3-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go/go.mod
          cache-dependency-path: runtime/go/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Verify Beget S3 access before compiling
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPP_S3_SECRET_ACCESS_KEY }}
        run: bun runtime/go/scripts/publish-s3.mjs --check-access
      - name: Test Go runtime
        working-directory: runtime/go
        run: go test ./...
      - name: Test S3 publication contract (Bun)
        run: bun test runtime/go/scripts/publish-s3.test.mjs
      - name: Build Linux amd64 and arm64 and verify SHA256
        run: bash runtime/go/scripts/build-pechka.sh
      - name: Publish SHA-pinned artifacts to Beget S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPP_S3_SECRET_ACCESS_KEY }}
        run: bun runtime/go/scripts/publish-s3.mjs
