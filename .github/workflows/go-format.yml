name: Go source formatting

on:
  push:
    branches: [master]
    paths:
      - 'runtime/go/**/*.go'
      - '.github/workflows/go-format.yml'

permissions:
  contents: write

concurrency:
  group: gofmt-master
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Normalize all Go source using gofmt
        shell: bash
        run: |
          set -euo pipefail
          find runtime/go -name '*.go' -type f -print0 | xargs -0 gofmt -w
          if git diff --quiet -- runtime/go; then
            echo "Go sources already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/go
          git commit -m 'style(go): format source with gofmt'
          git push origin HEAD:master
